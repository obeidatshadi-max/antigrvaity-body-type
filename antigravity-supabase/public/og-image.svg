<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8ddc0"/>
      <stop offset="100%" stop-color="#f0e8d0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Top rainbow stripes -->
  <rect x="0"    y="0" width="200" height="14" fill="#c94a2e"/>
  <rect x="200"  y="0" width="200" height="14" fill="#c97e2e"/>
  <rect x="400"  y="0" width="200" height="14" fill="#c9b42e"/>
  <rect x="600"  y="0" width="200" height="14" fill="#4a5c2e"/>
  <rect x="800"  y="0" width="200" height="14" fill="#2a5c7a"/>
  <rect x="1000" y="0" width="200" height="14" fill="#1c2630"/>

  <!-- Dark header band -->
  <rect x="0" y="14" width="1200" height="88" fill="#1c2630"/>

  <!-- antigravity-70s label -->
  <text x="44" y="68" font-family="'Arial Narrow',Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="4" fill="#c97e2e" text-transform="uppercase">ANTIGRAVITY-70S</text>

  <!-- Star top-right -->
  <text x="1148" y="72" font-family="Arial,sans-serif" font-size="44" fill="#c9b42e" text-anchor="middle">✦</text>

  <!-- MAIN TITLE LINE 1 -->
  <text x="600" y="196" font-family="'Arial Black','Arial Bold',Arial,sans-serif" font-size="86" font-weight="900" fill="#1c2630" text-anchor="middle" letter-spacing="6">THE HUMAN BODY</text>

  <!-- MAIN TITLE LINE 2 -->
  <text x="600" y="284" font-family="'Arial Black','Arial Bold',Arial,sans-serif" font-size="86" font-weight="900" fill="#c94a2e" text-anchor="middle" letter-spacing="6">AS A COMPANY</text>

  <!-- Subtitle -->
  <text x="600" y="326" font-family="'Courier New',Courier,monospace" font-size="17" fill="#4a5c2e" text-anchor="middle" letter-spacing="3">7 ESSENTIAL ORGANS  ·  7 CORE FUNCTIONS  ·  1 LIVING ORGANIZATION</text>

  <!-- Separator line dashed -->
  <line x1="80" y1="350" x2="1120" y2="350" stroke="#4a5c2e" stroke-width="1.5" stroke-dasharray="8,5" opacity="0.5"/>

  <!-- ── ORGAN PILLS ROW 1 (4 pills) ── -->
  <!-- 1. BRAIN -->
  <rect x="56"  y="366" width="256" height="64" rx="5" fill="#c94a2e"/>
  <text x="76"  y="392" font-family="'Arial Black','Arial Bold',Arial,sans-serif" font-size="20" font-weight="900" fill="white" letter-spacing="1">1. BRAIN</text>
  <text x="76"  y="416" font-family="Arial,sans-serif" font-size="13" fill="rgba(255,255,255,0.82)" letter-spacing="0.5">Leadership &amp; Strategy</text>

  <!-- 2. HEART -->
  <rect x="324" y="366" width="256" height="64" rx="5" fill="#b83232"/>
  <text x="344" y="392" font-family="'Arial Black','Arial Bold',Arial,sans-serif" font-size="20" font-weight="900" fill="white" letter-spacing="1">2. HEART</text>
  <text x="344" y="416" font-family="Arial,sans-serif" font-size="13" fill="rgba(255,255,255,0.82)" letter-spacing="0.5">Culture &amp; Motivation</text>

  <!-- 3. LUNGS -->
  <rect x="592" y="366" width="256" height="64" rx="5" fill="#c97e2e"/>
  <text x="612" y="392" font-family="'Arial Black','Arial Bold',Arial,sans-serif" font-size="20" font-weight="900" fill="white" letter-spacing="1">3. LUNGS</text>
  <text x="612" y="416" font-family="Arial,sans-serif" font-size="13" fill="rgba(255,255,255,0.82)" letter-spacing="0.5">Innovation &amp; Learning</text>

  <!-- 4. STOMACH -->
  <rect x="860" y="366" width="284" height="64" rx="5" fill="#8b5e3c"/>
  <text x="880" y="392" font-family="'Arial Black','Arial Bold',Arial,sans-serif" font-size="20" font-weight="900" fill="white" letter-spacing="1">4. STOMACH</text>
  <text x="880" y="416" font-family="Arial,sans-serif" font-size="13" fill="rgba(255,255,255,0.82)" letter-spacing="0.5">Operations</text>

  <!-- ── ORGAN PILLS ROW 2 (3 pills centered) ── -->
  <!-- 5. LIVER -->
  <rect x="128" y="446" width="284" height="64" rx="5" fill="#3a6b4a"/>
  <text x="148" y="472" font-family="'Arial Black','Arial Bold',Arial,sans-serif" font-size="20" font-weight="900" fill="white" letter-spacing="1">5. LIVER</text>
  <text x="148" y="496" font-family="Arial,sans-serif" font-size="13" fill="rgba(255,255,255,0.82)" letter-spacing="0.5">Risk Management &amp; Compliance</text>

  <!-- 6. KIDNEYS -->
  <rect x="458" y="446" width="284" height="64" rx="5" fill="#2a5c7a"/>
  <text x="478" y="472" font-family="'Arial Black','Arial Bold',Arial,sans-serif" font-size="20" font-weight="900" fill="white" letter-spacing="1">6. KIDNEYS</text>
  <text x="478" y="496" font-family="Arial,sans-serif" font-size="13" fill="rgba(255,255,255,0.82)" letter-spacing="0.5">Finance &amp; Audit</text>

  <!-- 7. IMMUNE SYSTEM -->
  <rect x="788" y="446" width="284" height="64" rx="5" fill="#4a3a6e"/>
  <text x="808" y="472" font-family="'Arial Black','Arial Bold',Arial,sans-serif" font-size="20" font-weight="900" fill="white" letter-spacing="1">7. IMMUNE SYSTEM</text>
  <text x="808" y="496" font-family="Arial,sans-serif" font-size="13" fill="rgba(255,255,255,0.82)" letter-spacing="0.5">Legal / Security / QA</text>

  <!-- Bottom dark band -->
  <rect x="0" y="534" width="1200" height="82" fill="#1c2630"/>

  <!-- Tagline -->
  <text x="600" y="566" font-family="'Arial Black','Arial Bold',Arial,sans-serif" font-size="17" font-weight="700" fill="#f0e8d0" text-anchor="middle" letter-spacing="1.5">WHEN EVERY PART KNOWS ITS ROLE — EXTRAORDINARY BECOMES INEVITABLE</text>

  <!-- Signature -->
  <text x="600" y="600" font-family="Georgia,'Times New Roman',serif" font-size="18" font-style="italic" fill="#c97e2e" text-anchor="middle">Shadi Shafiq Obeidat  ·  www.shobeidat.com</text>

  <!-- Bottom rainbow stripes -->
  <rect x="0"    y="616" width="200" height="14" fill="#1c2630"/>
  <rect x="200"  y="616" width="200" height="14" fill="#2a5c7a"/>
  <rect x="400"  y="616" width="200" height="14" fill="#4a5c2e"/>
  <rect x="600"  y="616" width="200" height="14" fill="#c9b42e"/>
  <rect x="800"  y="616" width="200" height="14" fill="#c97e2e"/>
  <rect x="1000" y="616" width="200" height="14" fill="#c94a2e"/>
</svg>
